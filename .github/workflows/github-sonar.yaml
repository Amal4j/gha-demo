name: SonarQube Analysis

on:
  push:
    branches:
      - main

jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    steps:   
      - name: Test SonarQube Connectivity
        run: |
          echo "Testing SonarQube connectivity..."
          curl -v "${{ secrets.SONAR_HOST_URL }}"
