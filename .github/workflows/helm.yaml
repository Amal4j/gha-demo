name: 12 Aug
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'release/*'
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - name: Login Azure
        uses: azure/login@v2
        with:
          tenant_id: ${{secrets.AZURE_TENANT_ID}}
          client_id: $ {{secrets.AZURE_CLIENT_ID}}
          subscription_id: $ {{secrets.AZURE_SUB_ID}}