name: Learning to Pass Artifacts among Job

on:
  workflow_dispatch:

jobs:

  uploading-artifact:

    runs-on: ubuntu-latest

    steps:

      - name: Create Sample File
        run: echo "Hello Amal and Jyoti" > sample.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learning
          path: sample.txt

  downloading-artifact:

    runs-on: ubuntu-latest

    needs: uploading-artifact

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Learning

      - name: Display File
        run: cat sample.txt
